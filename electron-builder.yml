# Đóng gói stag.ai cho Windows: `npm run dist` (bộ cài NSIS) hoặc `npm run dist:dir` (chỉ thư mục chạy được).
appId: ai.stag.app
productName: stag.ai
copyright: Copyright © 2026 stag.ai

directories:
  output: release
  buildResources: build

# Chỉ mã đã build (out/) + package.json. electron-builder tự thêm node_modules của `dependencies`.
files:
  - out/**
  - package.json
  # react, xterm, zustand đã được vite gộp vào out/renderer → không cần bản trong node_modules.
  # main chỉ require node-pty, @modelcontextprotocol/sdk, zod, sherpa-onnx-node (+ phụ thuộc của chúng).
  - '!node_modules/{react,react-dom,scheduler,zustand,@xterm}/**'
  # node-pty: chỉ giữ lib/ + prebuild win32-x64, bỏ mã C++, file debug (.pdb ~40 MB), test, nền tảng khác.
  - '!node_modules/node-pty/{src,deps,third_party,scripts,build,typings,binding.gyp}'
  - '!node_modules/node-pty/prebuilds/{darwin-*,linux-*,win32-arm64}/**'
  - '!node_modules/node-pty/prebuilds/**/*.pdb'
  # conpty.dll + OpenConsole.exe chỉ dùng khi bật `useConptyDll` (pty.ts không bật) → dùng ConPTY có sẵn của Windows.
  - '!node_modules/node-pty/prebuilds/win32-x64/conpty/**'
  - '!node_modules/node-pty/lib/**/*.{test.js,map}'
  # koffi: bản build sẵn nằm ở gói @koromix/koffi-win32-x64; bỏ header Node-API, tài liệu, mã C++ (giữ static.cjs / trampolines.cjs).
  - '!node_modules/koffi/{vendor,doc}/**'
  - '!node_modules/koffi/src/koffi/src/**/*.{cc,hh,inc,S,asm}'

# templates.ts đọc process.resourcesPath/templates khi app.isPackaged.
extraResources:
  - from: resources/templates
    to: templates
  # index.ts đọc process.resourcesPath/icons/tray.png (icon khay khi chọn "thu xuống khay").
  - from: resources/icons
    to: icons
  # skills.ts đọc process.resourcesPath/skill-catalog (Cài đặt → Skill → Khám phá).
  - from: resources/skill-catalog
    to: skill-catalog
  # plugins.ts: plugin kèm app (Cài đặt → Plugin → Có sẵn) + SDK chép vào plugin mới tạo từ mẫu.
  - from: resources/plugin-catalog
    to: plugin-catalog
  - from: resources/plugin-sdk
    to: plugin-sdk
  # inspect.ts: plugin Vite / loader Next / mu-plugin WordPress của chế độ Soi (chép vào dự án khi người dùng bấm).
  - from: resources/inspect
    to: inspect

asar: true

# Electron fuses: tắt tính năng của file chạy mà app không dùng (bị lợi dụng để chạy mã bằng chính stag.ai.exe).
electronFuses:
  # Phải giữ bật: node-pty dừng terminal trên Windows bằng child_process.fork (conpty_console_list_agent), mà fork
  # trong tiến trình chính của Electron cần ELECTRON_RUN_AS_NODE. Tắt thì đóng ô terminal / dev server không dừng
  # hết tiến trình con (còn giữ cổng).
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # Chỉ nạp app từ app.asar và kiểm tra toàn vẹn (electron-builder ghi hash vào stag.ai.exe; Windows từ Electron 30).
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
  # grantFileProtocolExtraPrivileges giữ mặc định (bật): trang app tải từ file://.

# Module native (.node, winpty-agent.exe) không nạp/chạy được từ trong asar.
asarUnpack:
  - node_modules/node-pty/**
  # Nhận dạng giọng nói: sherpa-onnx.node + onnxruntime.dll (nạp trong tiến trình voiceWorker).
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-win-x64/**
  # Computer use: koffi (FFI gọi user32 / SendInput) + bản build sẵn koffi.node cho win32-x64.
  - node_modules/koffi/**
  - node_modules/@koromix/**

# Không build lại module native: node-pty 1.1 có sẵn prebuild N-API (prebuilds/win32-x64) chạy được
# trong Electron mà không cần biên dịch, còn máy không có Visual Studio Build Tools để node-gyp chạy.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Giao diện chỉ có tiếng Việt/Anh → bỏ các gói ngôn ngữ Chromium khác cho nhẹ.
electronLanguages:
  - en-US
  - vi

win:
  target:
    - target: nsis
      arch: x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  # Bộ cài có các bước (không phải một-click): người dùng thấy và chọn được thư mục cài.
  oneClick: false
  # Mặc định cài cho riêng người dùng hiện tại (%LOCALAPPDATA%\Programs), không cần quyền admin;
  # trang chọn chế độ cài vẫn cho phép cài cho mọi người dùng nếu muốn.
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: stag.ai
  # Gỡ app không xoá workspaces.json / agents.json / template người dùng trong %APPDATA%\stag.ai.
  deleteAppDataOnUninstall: false
