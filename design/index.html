<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stag.ai · Ba hướng thiết kế</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: 52px 1fr; background: #0e0f12; color: #e8e9eb; font: 13px Inter, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 6px; padding: 0 16px; border-bottom: 1px solid #1f2126; }
  header b { margin-right: 18px; font-weight: 600; }
  header button { font: inherit; color: #9aa0aa; background: none; border: 0; padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  header button:hover { color: #fff; }
  header button.on { background: #1f2126; color: #fff; }
  header small { margin-left: auto; color: #6b7079; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <header>
    <b>stag.ai</b>
    <button class="on" data-src="1-graphite.html">1 · Graphite</button>
    <button data-src="2-paper.html">2 · Paper</button>
    <button data-src="3-nocturne.html">3 · Nocturne</button>
    <small id="note">Tối, gọn, dày thông tin — kiểu Linear</small>
  </header>
  <iframe id="f" src="1-graphite.html"></iframe>
<script>
  const notes = {
    '1-graphite.html': 'Tối, gọn, dày thông tin — kiểu Linear',
    '2-paper.html': 'Sáng, ấm, nhiều khoảng thở — kiểu sổ tay',
    '3-nocturne.html': 'Tối, kính mờ, có trang Tổng quan — kiểu bảng điều hành'
  };
  document.querySelectorAll('header button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('header button').forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('f').src = b.dataset.src;
    document.getElementById('note').textContent = notes[b.dataset.src];
  }));
</script>
</body>
</html>
